name: Spider Jar Gen CI

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v2

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Replace %JARVER% with formatted Beijing time
        run: |
          $utcTime = [System.DateTime]::UtcNow
          $beijingTime = $utcTime.AddHours(8)
          $timestamp = $beijingTime.ToString("yyyy.MMdd.HHmm")
          $files = @(
            "./app/src/main/java/com/github/catvod/spider/AList.java",
            "./app/src/main/java/com/github/catvod/spider/AListSh.java"
          )
          foreach ($filePath in $files) {
            (Get-Content $filePath) -replace '(protected|private) String jarVer = "%JARVER%";', "`$1 String jarVer = `"v.$timestamp(JAR)`";" | Set-Content $filePath
            Write-Host "Replaced %JARVER% in $filePath with v.$timestamp(JAR) (Beijing Time)"
          }

      - name: Build with Gradle
        run: ./build.bat ec

      - name: Update spider jar
        uses: EndBug/add-and-commit@v7
        with:
          default_author: github_actions
          message: 'update spider jar'
          add: "['./jar/xiaoya_proxy.jar', './jar/xiaoya_proxy.jar.md5']"